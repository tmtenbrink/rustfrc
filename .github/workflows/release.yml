# The release of rustfrc to PyPI, from examples/pypi-release.yml in touchgate,
# with the wheels built by wheels.yml. `touchgate approve` starts it with a
# signed approval, and the copies of this file and wheels.yml on `publish`
# run. PyPI trusts this file in the `release` environment.
name: release

on:
  workflow_dispatch:
    inputs:
      approval:
        description: The signed approval that `touchgate approve` sends
        required: true
        type: string

permissions: {}

env:
  # The public key that approves a release.
  TOUCHGATE_KEY: sk-ssh-ed25519@openssh.com AAAAGnNrLXNzaC1lZDI1NTE5QG9wZW5zc2guY29tAAAAIPK8VZox0UVPB1gsQowDPXlOj1Z34IIJ3V4I2chFNYONAAAAC3NzaDpzaWduaW5n release key
  # The uv that uploads the release, checked against the checksum setup-uv
  # knows for this version.
  UV_VERSION: 0.13.6

jobs:
  # Checks the approval before anything from the commit runs. touchgate is
  # installed before the checkout and reads the commit with git only.
  verify:
    name: Check the approval
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.verify.outputs.commit }}
    permissions:
      contents: read # to fetch the default branch
    steps:
      - uses: borink-org/touchgate/install@c8b416115b3395d5a91ae4a465d794ca437bc354 # v0.2.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      # touchgate reads the approval, the repository, the default branch and
      # the commit of this workflow from the run, and the key from
      # TOUCHGATE_KEY. It sets the output `commit` that the jobs below check
      # out.
      - id: verify
        run: touchgate verify

  # The commit is approved from here on, so reading it is safe. Plain
  # `check`, because `check --build` needs uv and only reports that uv
  # downloads maturin.
  check:
    name: Check the version
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read # to check out the release
    steps:
      - uses: borink-org/touchgate/install@c8b416115b3395d5a91ae4a465d794ca437bc354 # v0.2.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - run: touchgate check

  # Builds and tests the wheels and the sdist in jobs that cannot get a PyPI
  # token. ci.yml builds them with the same workflow.
  build:
    name: Build
    needs: verify
    uses: $/.github/workflows/wheels.yml
    permissions:
      contents: read # to check out the release
    with:
      ref: ${{ needs.verify.outputs.commit }}

  # Publishes only once every check on the release commit has passed.
  checks:
    name: Wait for the release commit's checks
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      checks: read # to read the release commit's check runs
    steps:
      - uses: borink-org/touchgate/install@c8b416115b3395d5a91ae4a465d794ca437bc354 # v0.2.0
      - run: touchgate wait-for-checks
        env:
          GH_TOKEN: ${{ github.token }}

  # Builds nothing from the commit. touchgate checks that the built files
  # are of this version, signs their attestations and uploads them.
  publish:
    name: Publish to PyPI
    needs: [verify, check, build, checks]
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: touchgate-publish
      cancel-in-progress: false
    permissions:
      contents: read # to check out the release
      id-token: write # for PyPI trusted publishing and the attestations
    steps:
      - uses: borink-org/touchgate/install@c8b416115b3395d5a91ae4a465d794ca437bc354 # v0.2.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: touchgate publish dist

  # This job runs last, so a tag always names a published release.
  github-release:
    name: Tag and release on GitHub
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the tag and the release
    steps:
      - uses: borink-org/touchgate/install@c8b416115b3395d5a91ae4a465d794ca437bc354 # v0.2.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      # Attaches the approval to the release, as touchgate-approval.txt.
      - run: touchgate github-release dist/*
        env:
          GH_TOKEN: ${{ github.token }}
