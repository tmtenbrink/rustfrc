name: ci

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test-linux:
    strategy:
      matrix:
        # The oldest Python, with the oldest NumPy, and the newest. wheels.yml
        # tests the wheels that a release publishes.
        py-version: ['3.9', '3.15']
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: ${{ matrix.py-version }}

    # uv builds the extension module with maturin as part of installing the project
    - name: uv sync
      run: uv sync --locked

    - name: Test lowest NumPy
      if: ${{ matrix.py-version == '3.9' }}
      run: uv pip install numpy==1.19.3

    - name: cargo test
      run: cargo test --locked

    - name: pytest
      run: uv run --no-sync pytest

  wheels:
    uses: $/.github/workflows/wheels.yml
    permissions:
      contents: read
