name: build-wheels

on:
  push:
    branches: [ main ]
  pull_request:
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  test-linux:
    strategy:
      matrix:
        py-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: ${{ matrix.py-version }}

    # uv builds the extension module with maturin as part of installing the project
    - name: uv sync
      run: uv sync --locked

    - name: Test lowest NumPy
      if: ${{ matrix.py-version == '3.10' }}
      run: uv pip install numpy==1.21.3

    - name: cargo test
      run: cargo test

    - name: pytest
      run: uv run --no-sync pytest

  build-macos:
    if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
    needs: [ test-linux ]
    runs-on: macos-latest
    strategy:
      matrix:
        py-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.py-version }}
      - name: Build wheels - universal2
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: universal2-apple-darwin
          args: --release --out dist -i ${{ matrix.py-version }}
      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-macos-${{ matrix.py-version }}
          path: ${{ github.workspace }}/dist

  build-windows:
    if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
    needs: [ test-linux ]
    runs-on: windows-latest
    strategy:
      matrix:
        py-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.py-version }}
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: x64
          args: --release --out dist -i ${{ matrix.py-version }}
      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-windows-${{ matrix.py-version }}
          path: ${{ github.workspace }}/dist

  build-linux:
    if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
    needs: [ test-linux ]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        py-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.py-version }}
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          rust-toolchain: stable
          target: x86_64
          manylinux: auto
          args: --release --out dist -i ${{ matrix.py-version }}
      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-linux-${{ matrix.py-version }}
          path: ${{ github.workspace }}/dist

  wheel-publish:
    name: Release
    runs-on: ubuntu-latest
    needs: [ build-macos, build-windows, build-linux ]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
      - name: Publish to PyPI
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_RUSTFRC_TOKEN }}
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: upload
          args: --skip-existing *
