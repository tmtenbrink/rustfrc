name: build-wheels

on:
  push:
    branches: [ main ]
  pull_request:
  release:
    types: [ published ]

jobs:
  test-linux:
    strategy:
      matrix:
        py-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: astral-sh/setup-uv@v10.3.3
      with:
        python-version: ${{ matrix.py-version }}

    # uv builds the extension module with maturin as part of installing the project
    - name: uv sync
      run: uv sync --locked

    - name: Test lowest NumPy
      if: ${{ matrix.py-version == '3.10' }}
      run: uv pip install numpy==1.21.3

    - name: cargo test
      run: cargo test

    - name: pytest
      run: uv run --no-sync pytest

  build-macos:
    if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
    needs: [ test-linux ]
    runs-on: macos-latest
    strategy:
      matrix:
        py-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.py-version }}
      - name: Build wheels - universal2
        uses: PyO3/maturin-action@v1
        with:
          target: universal2-apple-darwin
          args: --release --out dist -i ${{ matrix.py-version }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.py-version }}
          path: ${{ github.workspace }}/dist

  build-windows:
    if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
    needs: [ test-linux ]
    runs-on: windows-latest
    strategy:
      matrix:
        py-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.py-version }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist -i ${{ matrix.py-version }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.py-version }}
          path: ${{ github.workspace }}/dist

  build-linux:
    if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
    needs: [ test-linux ]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        py-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.py-version }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          rust-toolchain: stable
          target: x86_64
          manylinux: auto
          args: --release --out dist -i ${{ matrix.py-version }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.py-version }}
          path: ${{ github.workspace }}/dist

  wheel-publish:
    name: Release
    runs-on: ubuntu-latest
    needs: [ build-macos, build-windows, build-linux ]
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
      - name: Publish to PyPI
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_RUSTFRC_TOKEN }}
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --skip-existing *
