[package]
name = "rustfrc"
version = "1.2.0"
edition = "2024"

[lib]
name = "rustfrc"
crate-type = ["cdylib", "lib"]

[dependencies]
rand = "0.10"
rand_xoshiro = "0.8"
rayon = "1.12.0"
rustfft = "6"

[dependencies.pyo3]
version = "0.30.1"
# One wheel per platform for CPython 3.11 and later, the first stable ABI with the buffer
# protocol, and one for free-threaded CPython 3.15t and later; see .github/workflows/wheels.yml.
features = ["extension-module", "abi3-py311", "abi3t-py315"]

[target.'cfg(target_os = "linux")'.dependencies]
# madvise, for huge pages under the FRC spectrum.
libc = "0.2.191"

[dev-dependencies]
criterion = "0.8"
rand_distr = "0.6"

[[bench]]
name = "frc"
harness = false
