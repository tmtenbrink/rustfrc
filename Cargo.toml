[package]
name = "rustfrc"
version = "1.2.0"
edition = "2024"

[lib]
name = "rustfrc"
crate-type = ["cdylib", "lib"]

[dependencies]
numpy = "0.30"
ndarray = { version = "0.17", features = ["rayon"] }
rand = "0.10"
rand_distr = "0.6"
num-complex = "0.4.6"
num-traits = "0.2.19"

[dependencies.pyo3]
version = "0.30.1"
# One wheel per platform for CPython 3.10 and later, and one for
# free-threaded CPython 3.15t and later; see .github/workflows/wheels.yml.
features = ["extension-module", "abi3-py310", "abi3t-py315"]

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "rustfrc_bench"
harness = false
