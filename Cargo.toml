[package]
name = "rustfrc"
version = "1.2.0"
edition = "2024"

[lib]
name = "rustfrc"
crate-type = ["cdylib", "lib"]

[dependencies]
numpy = "0.30"
ndarray = { version = "0.17", features = ["rayon"] }
rand = "0.10"
rand_distr = "0.6"
num-complex = "0.4.6"
num-traits = "0.2.19"

[dependencies.pyo3]
version = "0.30.1"
features = ["extension-module"]

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "rustfrc_bench"
harness = false
