[project]
name = "rustfrc"
version = "1.2.0"
description = "Fast utility functions useful for Fourier Ring/Shell Correlation: binom_split, pois_gen, square_abs."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  {name = "Tip ten Brink", email = "tip@tenbrinkmeijs.com"},
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Image Processing"
]
dependencies = [
  "numpy >= 1.19.3",
]

[project.urls]
Source = "https://github.com/tmtenbrink/rustfrc"

[dependency-groups]
dev = [
  "pytest >= 9.0.3; python_version >= '3.10'",
  "pytest >= 8.4.2; python_version < '3.10'",
]

[tool.maturin]
python-source = "python"

[build-system]
requires = ["maturin>=1.16,<2.0"]
build-backend = "maturin"

[tool.uv]
# Rebuild the extension module when the Rust code changes
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "src/**/*.rs" }]
