[package]
name = "rustfrc-gpu"
version = "0.0.0"
edition = "2024"
publish = false
description = "Times binomial (n, 0.5) sampling on the GPU against rustfrc's CPU samplers."

# Not a member of rustfrc's build: wgpu stays out of the package.
[workspace]

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
pollster = "1.0.1"
rand = "0.10"
rand_distr = "0.6"
rand_xoshiro = "0.8"
rayon = "1.12.0"
rustfft = "6"
rustfrc = { path = ".." }
wgpu = "30"
